#cloud-config
package_update: true
packages:
  - nginx
write_files:
  - path: /var/www/html/index.nginx-debian.html
    owner: root:root
    permissions: "0644"
    content: |
      <!doctype html>
      <html lang="en">
        <head><meta charset="utf-8"><title>Terraform Linux VM</title></head>
        <body><h1>Hello from the Linux VM behind Azure Load Balancer</h1></body>
      </html>
runcmd:
  - [systemctl, enable, --now, nginx]
